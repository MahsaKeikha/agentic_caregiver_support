[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-caregiver-support"
version = "1.0.0"
description = "Reference multi-agent caregiver support governance workflow"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["."]
include = ["AGENTS*", "SKILLS*", "TOOLS*", "orchestration*", "memory*", "state*", "schemas*", "prompts*", "config*", "safety*", "observability*", "evals*", "benchmarks*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
